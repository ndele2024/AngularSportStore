server:
  port: 3500

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sportstore}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:ndele}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-for-sport-store-application-please-change}
